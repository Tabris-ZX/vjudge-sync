name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r '.version' Extension/manifest.json)"

          test "$TAG_VERSION" = "$MANIFEST_VERSION" || {
            echo "Tag and manifest versions differ: $TAG_VERSION != $MANIFEST_VERSION"
            exit 1
          }

      - name: Build release files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          (
            cd Extension
            zip -r "../dist/vjudge-sync-extension-v${VERSION}.zip" .
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/vjudge-sync-extension-v${VERSION}.zip"

          cat > release-notes.md <<EOF
          ## VJudge-Sync v${VERSION}

          fix: 修复oj未绑定过时无响应的问题

          
